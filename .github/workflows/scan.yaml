name: branch scanner

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      repository:
        required: true
        type: string
      branch:
        required: true
        type: string
      label:
        required: true
        type: string

    secrets:
      FCITK:
        required: true
      FCI_WEBHOOK_URL:
        required: true

env:
  PYTHONPATH: ${{ github.workspace }}/fcicd/src

jobs:
  scan:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/quantum-rlk/islimci:1.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.FCITK }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          path: caller

      - name: Checkout fcicd repository
        uses: actions/checkout@v4
        with:
          repository: quantum-rlk/fcicd
          ref: main
          token: ${{ secrets.FCITK }}
          path: fcicd

      - name: Run scanner
        working-directory: fcicd
        run: |
          python3.14 scripts/xcicd-bscanner.py \
            "${{ inputs.project }}" \
            "${{ inputs.repository }}" \
            "${{ inputs.branch }}" \
            "${{ inputs.label }}"

  verify:
    needs: scan
    if: ${{ needs.scan.result == 'success' }}

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/quantum-rlk/islimci:1.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.FCITK }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          path: caller

      - name: Checkout fcicd repository
        uses: actions/checkout@v4
        with:
          repository: quantum-rlk/fcicd
          ref: main
          token: ${{ secrets.FCITK }}
          path: fcicd

      - name: Run unit tests
        working-directory: fcicd
        run: |
          ls -l
          echo "Running tests ..."

  notify-failure:
    needs:
      - scan
      - verify

    if: ${{ always() && contains(needs.*.result, 'failure') }}

    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        uses: quantum-rlk/fastci/.github/actions/slack-failure@main
        with:
          webhook: ${{ secrets.FCI_WEBHOOK_URL }}
